        coord_cfg_hash_ABS_ORIG: 0cc62b38f041a2b79c51a18caeef4d6e7db7e3f443b3259c4f949d20de6a9cfd
        consequence: >-
          규약은 그대로 ABS_ORIG 이고 달라진 것은 소스 바이트뿐이다. 동결 export 15 벌은 옛 값을
          기록하고 있으므로, 새 실행의 값과 동결 값을 해시로 직접 대조하지 말고 이 기록을 거쳐 비교한다.
          칸 간 대조(tracking/mlflow_local.check_cells_identical)는 한 실행 묶음 안에서만 보므로 영향이 없다.
