      sha256: e2bed0003949c0a2e9e5c98c59925b483ba50a1a758740b868a88ae5649f431c
      note: 2026-08-21 최초 봉인. 09-02 전환 뒤 기록이 갱신되지 않았다
    after_public_cleanup:
      sha256: 06eb8289f853354ee236495a49230be4f93caadf12474f62d2bf12a4492d7fc9
      git_blob: db4b1c3dd10e989cb0c2c7c333a54e2aa84f2dd4
      changed: >-
        주석 두 줄에서 소관 표시를 뺐다. 4행은 "트랙 C가 소유하고, 트랙 D는 import만" 을
        "규약은 이 모듈이 정의하고 다른 쪽은 import만" 으로, 6행의 괄호 설명을 소관 이름 없이
        다시 썼고, 277행의 "테스트·픽스처 스크립트·트랙 D가" 를 "…·채점 쪽이" 로 바꿨다.
        코드·상수·공개 API·독스트링의 규약 서술은 건드리지 않았다.
      evidence: >-
        독스트링과 주석을 벗긴 구문 트리 다이제스트가 정리 전과 같다
        (a8245ff82daf86ad7bbae55f7297fb56e4e3b75733d798572f57ceb0de1508d2) — 실행되는 코드가 같다는 뜻이다.
        골든 픽스처 12건이 전부 통과한다(vlm/coords_fixtures/run_fixtures.py).
        문자열 상수가 바뀌면 구문 트리도 달라지므로 규약 이름·경계 상수가 섞여 든 경우는 이 검사가 잡는다.
      diverged:
