# vlm/coords.py 의 해시 이력 — 갈라진 값을 지우지 않고 병기한다.
#
# 왜 이 파일이 있나: `coords_source_sha256()` 이 이 모듈의 **바이트 전체**를 해시해
# `coord_cfg_hash` 의 입력에 넣는다. 그래서 주석 한 줄만 고쳐도 `coord_cfg_hash` 가 달라진다.
# 바이트를 되돌리면 공개본에 빼야 할 표기가 되살아나므로 되돌리지 않고, 사슬을 다른 방식으로 잇는다.
#
# 사슬: 동결 export 의 coord_cfg_hash -> 당시 바이트 -> 구문 트리 -> 지금 바이트
# 형식은 data/mock/FROZEN_RECORD.yaml 의 병기 방식을 따른다.
# 강제하는 시험: tests/test_coords_scrub_ast.py

files:
  vlm/coords.py:
    # 09-02 좌표 규약 ABS_ORIG 전환(dffd3db) 이후의 값. 검출 세 시드의 export 가 이 바이트로 돌았다.
    sha256: 43d1821fa8a0482f4e9140741968b77169beeed9cbf554bd616986ad1eb9693f
