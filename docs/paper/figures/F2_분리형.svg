<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <!-- F2 분리형 파이프라인 · 명세: docs/paper/그림_명세.md §2 · 흰 배경 / 평이어 / 규정 색인은 학습·교환 경계 바깥 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="800" fill="#ffffff"/>

  <!-- ============ 범례 ============ -->
  <rect x="1000" y="50" width="250" height="85" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
  <text x="1015" y="72" font-size="12" font-weight="bold" fill="#222">범례</text>
  <rect x="1015" y="84" width="22" height="14" fill="#eaf1f7" stroke="#222" stroke-width="2"/>
  <text x="1046" y="96" font-size="11.5" fill="#333">학습되는 부분</text>
  <rect x="1015" y="108" width="22" height="14" fill="#d9d9d9" stroke="#888" stroke-width="1.2"/>
  <text x="1046" y="120" font-size="11.5" fill="#333">고정 — 학습하지 않음</text>

  <!-- ============ 사진 ============ -->
  <g stroke="#666" stroke-width="1.5">
    <rect x="76" y="205" width="120" height="80" fill="#f4f4f4"/>
    <rect x="68" y="197" width="120" height="80" fill="#f9f9f9"/>
    <rect x="60" y="189" width="120" height="80" fill="#ffffff"/>
  </g>
  <circle cx="82" cy="212" r="8" fill="none" stroke="#888" stroke-width="1.5"/>
  <path d="M 68 255 L 100 230 L 122 246 L 142 232 L 180 255" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="120" y="312" text-anchor="middle" font-size="13" fill="#222">용접부 방사선 사진</text>

  <!-- ============ 학습·교환 경계 (점선) ============ -->
  <rect x="245" y="155" width="225" height="195" rx="8" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="357" y="146" text-anchor="middle" font-size="12" fill="#666">학습·교환 대상</text>
  <text x="357" y="325" text-anchor="middle" font-size="11.5" fill="#666">이 안의 가중치만 오간다</text>

  <!-- 검출 모델 (학습됨) -->
  <rect x="265" y="200" width="185" height="95" rx="6" fill="#eaf1f7" stroke="#222" stroke-width="2.2"/>
  <text x="357" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">결함 찾는 모델</text>
  <text x="357" y="261" text-anchor="middle" font-size="12" fill="#333">이 모델만 학습된다</text>
  <text x="357" y="281" text-anchor="middle" font-size="11.5" fill="#555">(참여자 간 교환 대상)</text>

  <!-- 검출 결과 -->
  <rect x="515" y="200" width="275" height="95" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.8"/>
  <text x="652" y="231" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">검출 결과</text>
  <text x="652" y="256" text-anchor="middle" font-size="12.5" fill="#333">결함 종류 · 픽셀 좌표 상자</text>
  <text x="652" y="278" text-anchor="middle" font-size="11.5" fill="#555">상자 크기는 mm 치수가 아님</text>

  <!-- 화살표: 사진 → 검출 모델 → 검출 결과 -->
  <line x1="205" y1="247" x2="260" y2="247" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="247" x2="509" y2="247" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 검출 결과 → 찾을 조건 (아래 줄로 내려감) -->
  <path d="M 652 295 L 652 358 L 290 358 L 290 414" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 아랫줄: 조건 → 조항 찾기 → 판정 모델 → 판정문 ============ -->
  <!-- 찾을 조건 -->
  <rect x="150" y="420" width="280" height="110" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.8"/>
  <text x="290" y="451" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">찾을 조건</text>
  <text x="290" y="476" text-anchor="middle" font-size="12" fill="#333">결함 종류 · 크기 ·</text>
  <text x="290" y="496" text-anchor="middle" font-size="12" fill="#333">판 두께 · 품질 수준</text>
  <text x="290" y="518" text-anchor="middle" font-size="11" fill="#555">미리 정한 형식으로만 만든다</text>

  <!-- 조항 찾기 -->
  <rect x="490" y="420" width="230" height="110" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.8"/>
  <text x="605" y="453" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">규정 조항 찾기</text>
  <text x="605" y="479" text-anchor="middle" font-size="12" fill="#333">조건에 맞는 조항을</text>
  <text x="605" y="499" text-anchor="middle" font-size="12" fill="#333">최대 3건 고른다</text>

  <!-- 판정 모델 (고정) -->
  <rect x="780" y="420" width="220" height="110" rx="6" fill="#d9d9d9" stroke="#666" stroke-width="1.8"/>
  <text x="890" y="455" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">판정 모델</text>
  <text x="890" y="481" text-anchor="middle" font-size="11.5" fill="#333">고정 — 학습하지 않는다</text>
  <text x="890" y="503" text-anchor="middle" font-size="11.5" fill="#333">확장 설계 · 전 구간 미검증</text>

  <!-- 판정문 -->
  <rect x="1050" y="420" width="200" height="110" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.8"/>
  <text x="1150" y="453" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">판정문</text>
  <text x="1150" y="479" text-anchor="middle" font-size="12" fill="#333">조건부 결론·부족한 정보</text>
  <text x="1150" y="501" text-anchor="middle" font-size="12" fill="#333">근거 조항 번호</text>

  <line x1="430" y1="475" x2="484" y2="475" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="475" x2="774" y2="475" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="475" x2="1044" y2="475" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 규정 색인 (학습·교환 경계 바깥) ============ -->
  <rect x="470" y="605" width="270" height="95" rx="6" fill="#fafafa" stroke="#666" stroke-width="1.5"/>
  <text x="605" y="632" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">규정 색인 — 공개 규정 문서</text>
  <text x="605" y="655" text-anchor="middle" font-size="11.5" fill="#333">학습하지 않고, 각 참여자가</text>
  <text x="605" y="673" text-anchor="middle" font-size="11.5" fill="#333">같은 색인을 쓴다</text>
  <text x="605" y="692" text-anchor="middle" font-size="11.5" fill="#333">교환·평균 대상이 아니다</text>
  <line x1="605" y1="601" x2="605" y2="537" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 각주 ============ -->
  <line x1="60" y1="728" x2="1240" y2="728" stroke="#dddddd" stroke-width="1"/>
  <text x="60" y="754" font-size="12" fill="#555">분리형 확장 설계다. 반복 실험을 마친 것은 검출기이며 규정 판정부의 성능을 검증한 결과가 아니다.</text>
  <text x="60" y="776" font-size="12" fill="#555">두께와 화소당 실치수가 없으면 이미지로 합부를 확정하지 않는다. 규정 색인은 집계 대상이 아니다.</text>
</svg>
