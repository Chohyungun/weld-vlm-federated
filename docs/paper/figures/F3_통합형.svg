<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <!-- F3 통합형 파이프라인 · 명세: docs/paper/그림_명세.md §3 · 흰 배경 / 평이어 / 규정 검색 없음이 비교 대비축 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="620" fill="#ffffff"/>

  <!-- ============ 범례 ============ -->
  <rect x="990" y="40" width="250" height="85" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
  <text x="1005" y="62" font-size="12" font-weight="bold" fill="#222">범례</text>
  <rect x="1005" y="74" width="22" height="14" fill="#eaf1f7" stroke="#222" stroke-width="2"/>
  <text x="1036" y="86" font-size="11.5" fill="#333">학습되는 부분</text>
  <rect x="1005" y="98" width="22" height="14" fill="#d9d9d9" stroke="#888" stroke-width="1.2"/>
  <text x="1036" y="110" font-size="11.5" fill="#333">고정 — 학습하지 않음</text>

  <!-- ============ 사진 ============ -->
  <g stroke="#666" stroke-width="1.5">
    <rect x="71" y="211" width="120" height="80" fill="#f4f4f4"/>
    <rect x="63" y="203" width="120" height="80" fill="#f9f9f9"/>
    <rect x="55" y="195" width="120" height="80" fill="#ffffff"/>
  </g>
  <circle cx="77" cy="218" r="8" fill="none" stroke="#888" stroke-width="1.5"/>
  <path d="M 63 261 L 95 236 L 117 252 L 137 238 L 175 261" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="115" y="318" text-anchor="middle" font-size="13" fill="#222">용접부 방사선 사진</text>

  <line x1="200" y1="245" x2="259" y2="245" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 통합 모델 ============ -->
  <rect x="265" y="150" width="450" height="250" rx="8" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="490" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">그림·글 통합 모델</text>

  <!-- 기본 모델 (고정) -->
  <rect x="295" y="205" width="390" height="85" rx="5" fill="#d9d9d9" stroke="#888" stroke-width="1.5"/>
  <text x="490" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">기본 모델</text>
  <text x="490" y="259" text-anchor="middle" font-size="12" fill="#333">고정 — 학습하지 않는다</text>
  <text x="490" y="279" text-anchor="middle" font-size="11.5" fill="#333">세 학습 방식이 모두 같은 출발점을 쓴다</text>

  <!-- 어댑터 (학습됨) -->
  <rect x="295" y="305" width="215" height="70" rx="5" fill="#eaf1f7" stroke="#222" stroke-width="2.2"/>
  <text x="402" y="331" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222">어댑터</text>
  <text x="402" y="351" text-anchor="middle" font-size="11.5" fill="#333">작은 추가 가중치</text>
  <text x="402" y="369" text-anchor="middle" font-size="11.5" fill="#333">이것만 학습된다</text>

  <text x="530" y="341" font-size="11.5" fill="#555">← 학습되는 것은</text>
  <text x="530" y="359" font-size="11.5" fill="#555">이 작은 부분뿐</text>

  <line x1="715" y1="275" x2="779" y2="275" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 판정문 ============ -->
  <rect x="785" y="175" width="435" height="210" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.8"/>
  <text x="1002" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">구조화한 출력 — 본실험 설계</text>
  <text x="815" y="241" font-size="12.5" fill="#333">· 결함 종류</text>
  <text x="815" y="267" font-size="12.5" fill="#333">· 원본 이미지의 픽셀 좌표 상자</text>
  <text x="815" y="293" font-size="12.5" fill="#333">· 후보 조항과 부족한 정보</text>
  <text x="815" y="319" font-size="12.5" fill="#333">· 인용한 규정 조항 번호</text>
  <text x="815" y="353" font-size="11.5" fill="#555">정해진 형식 하나로 묶여서 나온다</text>

  <!-- ============ 각주 ============ -->
  <line x1="60" y1="445" x2="1240" y2="445" stroke="#dddddd" stroke-width="1"/>
  <text x="60" y="472" font-size="12" fill="#555">별도 규정 검색 없이 조항을 출력한다. 조항 번호가 있다는 사실만으로 인용의 정확성을 보장하지 않는다.</text>
  <text x="60" y="494" font-size="12" fill="#555">조항 정합성과 근거 없는 인용은 별도 채점한다. 두께·화소당 실치수가 없어 이미지 합부는 검증하지 않는다.</text>
  <text x="60" y="524" font-size="12" fill="#555">이 그림은 계획한 모델 구성이다. 코드 구현과 실제 학습·평가 완료는 구분한다.</text>
</svg>
