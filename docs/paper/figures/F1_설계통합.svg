<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <!-- F1 연구 설계 통합도 · 명세: docs/paper/그림_명세.md §1 · 흰 배경 / 평이어 / 장수는 2026-08-24 실측 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fafafa"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#bbbbbb" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1280" height="680" fill="#ffffff"/>

  <!-- ============ 좌측: 데이터 단 ============ -->
  <!-- 사진 뭉치 아이콘 -->
  <g stroke="#666" stroke-width="1.5">
    <rect x="106" y="66"  width="140" height="92" fill="#f4f4f4"/>
    <rect x="98"  y="58"  width="140" height="92" fill="#f9f9f9"/>
    <rect x="90"  y="50"  width="140" height="92" fill="#ffffff"/>
  </g>
  <circle cx="125" cy="85" r="10" fill="none" stroke="#888" stroke-width="1.5"/>
  <path d="M 98 128 L 140 96 L 168 118 L 192 100 L 230 128" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="165" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">용접부 방사선 촬영 사진</text>
  <text x="165" y="203" text-anchor="middle" font-size="14" fill="#222">62,308장</text>

  <!-- 데이터 → 학습용 (직행) -->
  <line x1="160" y1="216" x2="160" y2="298" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 데이터 → 채점용 (좌측 우회 분기 — 상자 관통 없음) -->
  <path d="M 160 216 L 160 244 L 20 244 L 20 518 L 34 518" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 학습용 상자 -->
  <rect x="40" y="302" width="240" height="78" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.8"/>
  <text x="160" y="331" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">학습·검증용 80%</text>
  <text x="160" y="356" text-anchor="middle" font-size="12.5" fill="#333">C1·C2·C3 역할로 나눔</text>

  <!-- 채점용 상자 -->
  <rect x="40" y="470" width="240" height="96" rx="6" fill="#f2f2f2" stroke="#444" stroke-width="1.8"/>
  <text x="160" y="499" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">채점용 20%</text>
  <text x="160" y="522" text-anchor="middle" font-size="12.5" fill="#333">다른 무엇보다 먼저 떼어 놓고</text>
  <text x="160" y="541" text-anchor="middle" font-size="12.5" fill="#333">어떤 학습에도 쓰지 않는다</text>

  <!-- 학습용 → 학습 방식 틀 -->
  <line x1="280" y1="341" x2="304" y2="341" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 중앙: 학습 방식 (본실험 한 행 + 사전실험 한 행) ============ -->
  <rect x="308" y="92" width="704" height="326" rx="8" fill="none" stroke="#dddddd" stroke-width="1.5"/>

  <!-- 열 머리 -->
  <g text-anchor="middle">
    <text x="527" y="120" font-size="16" font-weight="bold" fill="#222">로컬 단독</text>
    <text x="527" y="141" font-size="11.5" fill="#555">각 역할의 자체 자료로 학습</text>

    <text x="717" y="120" font-size="16" font-weight="bold" fill="#222">중앙집중</text>
    <text x="717" y="141" font-size="11.5" fill="#555">모든 데이터를 한곳에 모아 학습</text>
    <text x="717" y="157" font-size="11.5" fill="#555">전체 학습자료를 쓰는 비교 기준</text>

    <text x="907" y="120" font-size="16" font-weight="bold" fill="#222">연합학습</text>
    <text x="907" y="141" font-size="11.5" fill="#555">각자의 자료를 두고</text>
    <text x="907" y="157" font-size="11.5" fill="#555">학습된 가중치만 주고받음</text>
  </g>

  <!-- 행 라벨 (한 줄 8자 이하 — 셀 좌변 x=432 침범 금지) -->
  <g font-size="12.5" fill="#333">
    <text x="320" y="198" font-size="15" font-weight="bold" fill="#222">통합형</text>
    <text x="320" y="219">사진을 넣으면</text>
    <text x="320" y="236">결함과 근거를</text>
    <text x="320" y="253">한 번에</text>
    <text x="320" y="274" font-size="11.5" fill="#666">— 본실험 계획</text>

    <text x="320" y="340" font-size="14" font-weight="bold" fill="#888">분리형</text>
    <text x="320" y="360" fill="#888">사전실험은</text>
    <text x="320" y="377" fill="#888">결함 검출까지만</text>
    <text x="320" y="394" fill="#888">수행한 범위</text>
  </g>

  <!-- 셀 — 위 행이 이번 실험(통합형 세 방식), 아래 행은 먼저 돌린 사전실험(옅게) -->
  <!-- 1행: 통합형 — 로컬 단독은 회사마다 자체 모델이라 상자 셋 -->
  <rect x="432" y="178" width="190" height="100" fill="#f2f2f2" stroke="#444" stroke-width="1.5"/>
  <text x="527" y="203" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#222">통합형 · 로컬 단독</text>
  <g stroke="#666" stroke-width="1.2" fill="#ffffff">
    <rect x="449" y="216" width="52" height="34"/>
    <rect x="501" y="216" width="52" height="34"/>
    <rect x="553" y="216" width="52" height="34"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333">
    <text x="475" y="238">C1</text>
    <text x="527" y="238">C2</text>
    <text x="579" y="238">C3</text>
    <text x="527" y="268">참여자 역할별 모델 하나</text>
  </g>

  <rect x="622" y="178" width="190" height="100" fill="#f2f2f2" stroke="#444" stroke-width="1.5"/>
  <text x="717" y="233" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#222">통합형 · 중앙집중</text>

  <rect x="812" y="178" width="190" height="100" fill="#f2f2f2" stroke="#444" stroke-width="1.5"/>
  <text x="907" y="233" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#222">통합형 · 연합학습</text>

  <!-- 2행: 분리형 — 검출기만 먼저 돌린 사전실험 -->
  <text x="432" y="302" font-size="11.5" fill="#888">먼저 돌린 사전실험 — 결함 찾는 모델만</text>
  <rect x="432" y="308" width="190" height="100" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="527" y="363" text-anchor="middle" font-size="13.5" fill="#777">분리형 · 로컬 단독</text>

  <rect x="622" y="308" width="190" height="100" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="717" y="363" text-anchor="middle" font-size="13.5" fill="#777">분리형 · 중앙집중</text>

  <rect x="812" y="308" width="190" height="100" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="907" y="363" text-anchor="middle" font-size="13.5" fill="#777">분리형 · 연합학습</text>

  <!-- ============ 우측: 공통 채점기 ============ -->
  <rect x="1078" y="240" width="172" height="130" rx="10" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
  <text x="1164" y="282" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">공통 채점기</text>
  <text x="1164" y="308" text-anchor="middle" font-size="12" fill="#333">모든 조건이</text>
  <text x="1164" y="326" text-anchor="middle" font-size="12" fill="#333">같은 사진, 같은 기준</text>
  <text x="1164" y="344" text-anchor="middle" font-size="12" fill="#333">하나의 채점 프로그램</text>

  <!-- 각 조건의 출력 → 채점기 수렴 (틀 우측 변에서 출발 — 셀 관통 없음) -->
  <path d="M 1012 228 L 1072 288" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1012 358 L 1072 322" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1042" y="216" text-anchor="middle" font-size="11.5" fill="#555">판정 결과</text>

  <!-- 채점용 사진 → 채점기 (하단 우회, 점선) -->
  <path d="M 280 518 L 1164 518 L 1164 376" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="700" y="506" text-anchor="middle" font-size="12" fill="#555">채점용 사진은 채점에만 쓰인다</text>

  <!-- ============ 각주 ============ -->
  <line x1="40" y1="600" x2="1240" y2="600" stroke="#dddddd" stroke-width="1"/>
  <text x="40" y="626" font-size="12" fill="#555">위 행은 본실험 계획, 아래 행은 검출기 사전실험이다. C1·C2·C3는 공개 자료로 구성한 역할이며 실제 세 회사가 아니다.</text>
  <text x="40" y="648" font-size="12" fill="#555">장수는 기존 동결 분할 기준이다. 학습·평가의 유사 영상 문제가 남아 있어 기존 평가셋의 결과는 탐색적으로 해석한다.</text>
</svg>
