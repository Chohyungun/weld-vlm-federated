<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <!-- F4 연합학습 라운드 · 명세: docs/paper/그림_명세.md §4 · 흰 배경 / 평이어 · 장수는 2026-08-24 실측, 라운드 수·통신량은 미실측 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="750" fill="#ffffff"/>

  <!-- ============ 연합 순환 경계 (점선) ============ -->
  <rect x="60" y="30" width="1040" height="535" rx="12" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="80" y="54" font-size="12.5" fill="#666">연합학습의 순환 — 이 경계 안에서는 학습된 가중치만 오간다</text>

  <!-- ============ 서버 ============ -->
  <rect x="480" y="70" width="320" height="82" rx="8" fill="#ffffff" stroke="#222" stroke-width="2.2"/>
  <text x="640" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">서버</text>
  <text x="640" y="121" text-anchor="middle" font-size="12" fill="#333">받은 가중치를 회사별 사진 수에 비례해</text>
  <text x="640" y="139" text-anchor="middle" font-size="12" fill="#333">④ 평균하고, 평균본을 다시 나눠준다</text>

  <!-- 순환 횟수 주석 -->
  <text x="955" y="100" text-anchor="middle" font-size="12.5" fill="#555">이 순환(①~④)을</text>
  <text x="955" y="119" text-anchor="middle" font-size="12.5" fill="#555">{R}회 반복한다</text>

  <!-- ============ 서버 ↔ 회사 화살표 (내려감 ① / 올라감 ③) ============ -->
  <!-- 회사 A -->
  <line x1="540" y1="152" x2="206" y2="326" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="234" y1="326" x2="568" y2="152" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- 회사 B -->
  <line x1="626" y1="152" x2="626" y2="326" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="654" y1="326" x2="654" y2="152" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="608" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">①</text>
  <text x="674" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">③</text>
  <!-- 회사 C -->
  <line x1="740" y1="152" x2="952" y2="326" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="980" y1="326" x2="768" y2="152" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ============ 회사 3곳 ============ -->
  <!-- 회사 A -->
  <rect x="110" y="330" width="220" height="170" rx="8" fill="#f2f2f2" stroke="#444" stroke-width="1.8"/>
  <text x="220" y="358" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#222">회사 A — 강재, 대형</text>
  <text x="220" y="381" text-anchor="middle" font-size="12.5" fill="#333">사진 28,828장</text>
  <text x="220" y="406" text-anchor="middle" font-size="12.5" fill="#333">② 자기 사진으로만 학습</text>
  <circle cx="141" cy="459" r="9" fill="none" stroke="#a33" stroke-width="2"/>
  <line x1="134.6" y1="465.4" x2="147.4" y2="452.6" stroke="#a33" stroke-width="2"/>
  <text x="158" y="456" font-size="11.5" fill="#a33">사진은 회사 밖으로</text>
  <text x="158" y="473" font-size="11.5" fill="#a33">나가지 않는다</text>

  <!-- 회사 B -->
  <rect x="530" y="330" width="220" height="170" rx="8" fill="#f2f2f2" stroke="#444" stroke-width="1.8"/>
  <text x="640" y="358" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#222">회사 B — 강재, 중형</text>
  <text x="640" y="381" text-anchor="middle" font-size="12.5" fill="#333">사진 14,414장</text>
  <text x="640" y="406" text-anchor="middle" font-size="12.5" fill="#333">② 자기 사진으로만 학습</text>
  <circle cx="561" cy="459" r="9" fill="none" stroke="#a33" stroke-width="2"/>
  <line x1="554.6" y1="465.4" x2="567.4" y2="452.6" stroke="#a33" stroke-width="2"/>
  <text x="578" y="456" font-size="11.5" fill="#a33">사진은 회사 밖으로</text>
  <text x="578" y="473" font-size="11.5" fill="#a33">나가지 않는다</text>

  <!-- 회사 C -->
  <rect x="880" y="330" width="200" height="170" rx="8" fill="#f2f2f2" stroke="#444" stroke-width="1.8"/>
  <text x="980" y="352" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#222">회사 C</text>
  <text x="980" y="371" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">알루미늄, 소형</text>
  <text x="980" y="392" text-anchor="middle" font-size="12.5" fill="#333">사진 7,156장</text>
  <text x="980" y="412" text-anchor="middle" font-size="12.5" fill="#333">② 자기 사진으로만 학습</text>
  <circle cx="906" cy="459" r="9" fill="none" stroke="#a33" stroke-width="2"/>
  <line x1="899.6" y1="465.4" x2="912.4" y2="452.6" stroke="#a33" stroke-width="2"/>
  <text x="923" y="456" font-size="11.5" fill="#a33">사진은 회사 밖으로</text>
  <text x="923" y="473" font-size="11.5" fill="#a33">나가지 않는다</text>

  <!-- 회사 C 표시 (소규모 참여 이득 확인 대상) -->
  <text x="980" y="522" text-anchor="middle" font-size="11.5" fill="#555">↑ 작은 회사가 연합 참여로</text>
  <text x="980" y="539" text-anchor="middle" font-size="11.5" fill="#555">이득을 보는지 확인하는 대상</text>

  <!-- 순환 단계 요약 (경계 안 하단) -->
  <text x="80" y="545" font-size="12" fill="#555">① 가중치 배포 → ② 각 회사 자기 사진으로 학습 → ③ 학습된 가중치만 반환 → ④ 평균, 다시 ①</text>

  <!-- ============ 경계 밖: 교환물 크기 주석 ============ -->
  <text x="60" y="596" font-size="12" fill="#555">한 번 오갈 때 주고받는 크기 (실측으로 채움):</text>
  <text x="60" y="616" font-size="12" fill="#555">분리형 = 결함 찾는 모델 전체 {} MB  ·  통합형 = 어댑터(작은 추가 가중치)만 {} MB</text>

  <!-- ============ 경계 밖: 규정 색인 ============ -->
  <rect x="920" y="580" width="320" height="86" rx="8" fill="#fafafa" stroke="#666" stroke-width="1.5"/>
  <text x="1080" y="606" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222">규정 색인 — 공개 규정 문서</text>
  <text x="1080" y="628" text-anchor="middle" font-size="12" fill="#333">모든 회사가 같은 것을 사용하며</text>
  <text x="1080" y="647" text-anchor="middle" font-size="12" fill="#333">교환·평균 대상이 아니다</text>
  <line x1="1080" y1="580" x2="1080" y2="566" stroke="#666" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- ============ 각주 ============ -->
  <line x1="60" y1="695" x2="1240" y2="695" stroke="#dddddd" stroke-width="1"/>
  <text x="60" y="722" font-size="12" fill="#555">본 실험의 연합학습은 GPU 1장 위의 모의 실행(시뮬레이션)이며, 통신량은 주고받는 가중치 묶음의 실측 크기 × 반복 횟수 × 회사 수로 계산한다.</text>
</svg>
