# GPU 프로파일 — 16GB (로컬 RTX 5060 Ti, Blackwell sm_120)
#
# 검출 값은 2026-08-24 실측으로 확정했다(파일 하단 pilot_measured).
# VLM 값은 통합형 착수 시 재측정한다 — 비전 토큰 때문에 검출과 프로파일이 다르다.
# 48gb.yaml 과 키 집합이 완전히 같아야 한다.
# 실측 근거: scripts/check_env.py — torch 2.11.0+cu128 / sm_120 / 15.9 GiB / bf16 autocast 정상.
#
# ======================================================================================
# 이 파일의 지위 — **참고 프로파일이다. 학습 실행값의 정본이 아니다.** (74번 감사 P11)
# ======================================================================================
#
# 이전 판은 머리글에 "코드는 이 파일을 읽을 뿐"이라고 적었지만 사실이 아니었다.
# `detection:` 블록을 읽는 코드가 저장소에 하나도 없다. 그래서 `detection.workers: 0` 이
# 아무 효과 없이 놓여 있었고, 파일럿 13개 런은 전부 ultralytics 기본 8 로 돌았다
# (`outputs/pilot_c/**/args.yaml` 13건 전수 확인 — 예외 0). C 가 "설정이 정본"이라는
# 전제로 "workers=0 · Windows spawn 이 GPU 저활용 원인"이라는 §5-1 진단을 썼고,
# 그것이 감사 M2 오진이 됐다. 설정과 실행값이 갈라진 상태가 낳은 사고다.
#
# 배선하는 쪽으로 정리할 수도 있었으나 **배선 지점이 `detection/round_runner.py` 라
# 트랙 C 소관이다.** A 가 남의 트랙 파일을 고치지 않는다는 규칙이 우선한다.
# 따라서 이 파일은 문서로 강등하고, 아래에 실행값 정본의 위치를 명시한다.
#
#   학습 실행값 정본:  detection/round_runner.py  ·  PROFILES / FIXED_OVERRIDES / FIXED_PILOT
#   (호출자가 덮어쓸 수 없는 5칸 공통 고정값이 거기 있다. 프로파일을 통째로 교체하는
#    방식이라 칸별로 몰래 다른 값을 넣는 경로가 막혀 있다 — 그 설계를 존중한다.)
#
# 아래 `detection:` 값은 그 정본과 **일치하는지 확인한 사본**이다(2026-09-02 대조).
# 값을 여기서 고쳐도 학습은 바뀌지 않는다. 실제로 바꾸려면 C 에 요청해야 한다.

profile: "16gb"
device: cuda

hardware:
  name: "NVIDIA GeForce RTX 5060 Ti"
  vram_gib: 16
  compute_capability: "12.0"     # sm_120 → cu128 이상 필수. cu121 계열 휠은 동작하지 않는다.
  driver: "581.08"

precision:
  amp_dtype: bf16                # Blackwell 은 bf16 네이티브. fp16 로 내리지 않는다.
  matmul_tf32: true
  # 결정론 설정은 base.yaml 의 seed 절에서 관리한다 (cudnn.deterministic).

# ⚠ 미배선. 읽는 코드가 없다. 정본은 detection/round_runner.py:PROFILES (트랙 C 소관).
detection:                       # YOLO11s (본실험) / YOLO11n (파일럿)
  wired: false                   # 이 블록이 실행에 영향을 주지 않는다는 사실을 값으로 박는다
  runtime_source_of_truth: "detection/round_runner.py:PROFILES"
  batch: 32                      # = FIXED_OVERRIDES["batch"]. 실측 근거는 아래 pilot_measured
  imgsz: 640                     # = FIXED_OVERRIDES["imgsz"]
  # ultralytics 기본값 8 이 그대로 실행된다. 이전 판은 0 을 적어 두고 0 이 실행된다고
  # 믿었다 — 그 착오가 감사 M2 다. 여기에는 **실제로 돌아간 값**을 적는다.
  workers: 8                     # 파일럿 13개 런 args.yaml 전수 실측. 배선되면 재검토 대상
  amp: true

vlm:                             # Qwen 계열 QLoRA
  load_in_4bit: true
  per_device_batch: 1            # 통합형은 비전 토큰이 커서 검출과 프로파일이 다르다. 실측 전 보수값
  grad_accum: 32                 # per_device_batch * grad_accum = 유효 배치 32
  gradient_checkpointing: true
  max_seq_len_qa: 1024
  max_seq_len_reason: 2048

fl:                              # Flower 시뮬레이션
  detection_concurrency: 1       # num_gpus=1.0 순차. Ray 자원 배정은 비강제라 초과 시 타 액터가 죽는다
  vlm_concurrency: 1             # VLM 은 클라이언트 하나가 GPU 를 다 쓴다. 순차 실행 고정.

serving:                         # 합성 생성 / 평가 추론
  # vLLM 은 이 환경에서 쓰지 않는다. cu128 과 충돌해 torch 2.8.0 강등을 요구하고 Windows 미지원이다.
  # greedy 1회 고정이라 transformers.generate 와 출력이 같고 손해는 배치 처리량뿐이다.
  backend: "transformers"
  vllm_gpu_memory_utilization: null   # Linux GPU 확보 시
  vllm_max_model_len: null            # Linux GPU 확보 시

# ---------------------------------------------------------------------------
# 파일럿 실측 (2026-08-24) — YOLO11n, imgsz 416, coco8, 1 epoch
#
# batch 를 8까지 올려도 peak 0.34 GB 다. **16GB 에서 검출 학습의 병목은 메모리가 아니다.**
# 따라서 파일럿에서 batch 를 1~2 로 제한할 이유가 없고, 제약은 데이터 크기와 시간 쪽에 있다.
# 다만 아래 수치는 coco8(4장) 기준이라 실데이터의 원본 디코딩 비용을 포함하지 않는다.
# 파노라마가 섞이면 디코딩 단계 메모리가 달라지므로 분할 동결 후 재측정한다.
pilot_measured:
  model: "yolo11n.pt"
  imgsz: 416
  dataset: "coco8 (4 images)"
  batches:
    - {batch: 1, peak_gb: 0.18, reserved_gb: 0.20, epoch_s: 74.7}   # 첫 실행 워밍업 포함
    - {batch: 2, peak_gb: 0.24, reserved_gb: 0.26, epoch_s: 12.7}
    - {batch: 4, peak_gb: 0.34, reserved_gb: 0.39, epoch_s: 8.7}
    - {batch: 8, peak_gb: 0.34, reserved_gb: 0.39, epoch_s: 1.9}    # 4장뿐이라 batch 4 와 동일 처리
  note: |
    유효 측정은 batch 4 까지다(coco8 이 4장이라 batch 8 은 실제로 4장만 돈다).
    기울기는 약 0.04 GB/배치이므로 batch 32 도 1.5 GB 안쪽으로 추정된다.
    시간 외삽은 신뢰하지 않는다 — 4장 기준이라 데이터 로딩·증강 오버헤드가 빠져 있다.
