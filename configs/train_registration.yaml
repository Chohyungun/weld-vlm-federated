# 봉인 페어 2판의 학습 입력 결속(2026-10-27). 기존 학습 예산·시드·최적화 값은 유지한다.
# 1차 실행의 등록 원문·출력·착수 고정은 보존하며, 이 파일 갱신이 재학습을 실행하지는 않는다.
# 학습 쪽 판독기 vlm/registration.py 의 KIND
kind: train_registration
# 등록 파일의 스키마 판 — 실험 회차가 아니다(vlm.registration.VERSION)
version: 1
# 의사결정로그 2026-10-13 13:5x「본실험 등록 조건 확정」 — 시드 1(시드 번호, configs/base.yaml experiment.seeds 의 첫째 값 20260828)
seed_indices:
- 1
# 의사결정로그 2026-10-13 13:5x「본실험 등록 조건 확정」 R = 1 — configs/base.yaml uni_train_budget.num_rounds 와 같아야 한다
num_rounds: 1
# 의사결정로그 2026-10-13 13:5x「본실험 등록 조건 확정」 E = 1 — configs/base.yaml uni_train_budget.local_epochs
local_epochs: 1
# 의사결정로그 2026-10-13 13:5x「본실험 등록 조건 확정」 N = 1 — configs/base.yaml uni_train_budget.total_epochs
total_epochs: 1
# 봉인 페어 토큰 표의 recipe와 S13 권고 한도에서 읽었다. 프롬프트는 base.yaml과 등록 판독기가 맞댄다.
recipe: json_line_then_basis
eval_gen_limit: 1280
# 의사결정로그 2026-10-13 13:5x「본실험 등록 조건 확정」 4bit(nf4) — 학습 코드의 적재 인자 vlm/pilot_vlm.py QUANT_4BIT
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true
# 의사결정로그 2026-10-13 13:5x「본실험 등록 조건 확정」 마이크로 배치 1 — vlm/pilot_vlm.py MICRO_BATCH
micro_batch: 1
# 의사결정로그 2026-10-31 「2 차 학습량 재결정」 누적 8(2026-10-13 의 32 에서 바꿈 — 2 차 결과를 보기 전) — vlm/pilot_vlm.py GRAD_ACCUM
grad_accum: 8
# 의사결정로그 2026-10-13 13:5x「본실험 등록 조건 확정」 학습률 1e-4 — vlm/pilot_vlm.py LR
lr: 0.0001
# 규칙 파일 configs/early_coord_check.yaml 의 version 과 바이트 sha256(소문자 16진) — 미정 칸을 채운 판(wt/D 1b66bb2 의 4판)이 본체에 들어온 뒤, 그 파일에서 읽어 채운다. 손으로 옮기지 않는다
early_coord_check_rules:
  version: 4
  sha256: 99a3940b6a1d10f4538d455777f9eb10d810f3b32b0e76592f201372680c7f51
# null — 공통 초기 어댑터는 착수 고정이 묶는다(값을 두면 그 digest 와 맞댄다)
init_adapter_digest: null
# 의사결정로그 2026-10-31 「2 차 학습량 재결정」 — 공통 학습 예산 비율 1/4(2026-10-16 의 1/8 에서 바꿈 — 1 차 실패 원인, 2 차 결과를 보기 전.
# 실험설계 6-4 조건 2, 다섯 칸 같은 비율). 학습 쪽 판독기 vlm/registration.py 의
# 선택 칸(없으면 1.0) — 뜻과 식은 vlm/budget.py. 학습 쪽(C)이 지시 1016j 로 이 칸 하나를 더했다
budget_fraction: 0.25
# 학습 전 계약의 실제 바이트 지문. 페어·표·로더·생성 경로·조건 자료를 함께 대조한다.
narrative_inputs:
  version: 1
  sha256: dd0808263e74841bc13b3de120f29a6cd74c718880091a85f84ad132c6c3070e
