# 합성 corpus 검증기 사전 등록 — 체크리스트 9번 (80번 G12-3·G12-4)
#
# 소관: 트랙 B (corpus). **파일은 configs/ 아래이지만 A 의 파일을 고치지 않았다** —
# D 의 configs/rag.yaml 과 같은 형태이며, 감사 P13 이 "서브시스템 설정은 소관 재배정으로
# 정리하는 편이 맞다"고 올린 항목이다. 총괄 배분을 요청한다.
#
# 왜 사전 등록인가. 파일럿에서 검증기 둘의 통과율이 0.3876 대 0.9551 로 56.75pp 갈렸고
# 보고서는 그것을 "계열 차이"로 읽었다. 재검이 뒤집었다 — **계열 + 설정 차이**다.
# 한쪽은 사고를 프리필로 억제하고 예산을 32 토큰으로 잘랐고, 다른 쪽은 자유 생성 64
# 토큰이었다. 조건이 다른 두 값을 나란히 놓고 정본을 골랐으니 그 선택에 근거가 없다.
#
# 그래서 여기에 **예산·사고 정책·프롬프트·파싱 규칙을 먼저 못 박고** 비교한다.
# 정본 선정은 사람 라벨 100건의 정밀도·재현율로 한다 (§labeling). 라벨 없이 잰 값은
# 보고서에서 pass_rate 가 아니라 judge_agreement 로만 싣는다.

version: 1
updated: 2026-09-02

generation:
  model: Qwen/Qwen2.5-7B-Instruct
  decoding: greedy          # do_sample=False, 재시도·재프롬프트 금지 (개발규약 3-4)
  max_new_tokens: 200
  # 배치는 재현 조건의 일부다 — 좌측 패딩 때문에 배치가 다르면 같은 프롬프트도 다른
  # 문장이 나온다(자체 실측). 산출물에 반드시 기록한다.
  batch_size: 8

judges:
  # 두 후보를 **같은 예산·같은 사고 정책**으로 잰다. 어느 쪽도 유리한 조건을 갖지 않는다.
  budget:
    max_new_tokens: 96      # 판정 + 사유 한 문장. 두 후보 공통.
    reason_max_new_tokens: 72
  thinking_policy: suppress # 사고 블록을 프리필로 닫는다. 추론형·비추론형 공통 적용.
  # 양자화도 후보 공통이다. 8B bf16 은 16GB 에 안 들어가고, 한쪽만 4bit 로 내리면
  # 그것이 새 교락이 된다 — 예산을 맞춰 놓고 정밀도를 갈라 놓는 셈이다.
  # 로컬 16GB 제약에서 나온 선택이며, 48GB 프로파일에서는 둘 다 bf16 으로 되돌린다.
  quantization: 4bit
  candidates:
    - id: deepseek
      model: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
      family: llama         # 생성(Qwen2.5)과 다른 계열 — 자기검증 금지 (개발규약 3-5)
    - id: phi
      model: microsoft/Phi-4-mini-instruct
      family: phi
  # 정본은 사람 라벨 비교 전까지 **미정**이다. null 이면 실행기가 두 후보를 모두 돌리고
  # 어느 쪽도 정본으로 표시하지 않는다.
  canonical: null
  canonical_selected_by: null      # 채우려면 §labeling 산출물의 경로와 지표를 함께 적는다

parsing:
  # 부분문자열 매칭은 LOOKS·TOKEN·WRONG 같은 낱말을 판정으로 읽는다 (80번 B16).
  # 앵커 매칭으로 바꾸고, 앵커에 걸리지 않으면 형식 위반으로 따로 센다.
  verdict_anchors: ["^\\s*(OK|NG)\\b", "판정\\s*[:：]?\\s*(OK|NG)\\b", "\\b(OK|NG)\\s*$"]
  format_violation_is_not_pass: true
  # 기각 사유가 입력 문장의 되풀이면 사유가 아니다. 파일럿에서 109건 중 97건(89%)이
  # 되풀이였고 실질 사유는 12건이었다 (B17).
  reason_echo_threshold: 0.8       # 최장 공통 부분열 / 사유 길이
  reason_echo_downgrade_to: "사유 미기재"

labeling:
  # 정본 선정 근거. 축 2 × 판정 2 층화로 100건을 뽑아 사람이 OK/NG 를 붙인다.
  n: 100
  strata: [["조항검색_기준서술", "조치서술"], ["judge_pass", "judge_fail"]]
  seed: 20260902
  sheet: corpus/validate/judge_labels/sheet_v1.jsonl      # 실행기가 만든다
  labels: corpus/validate/judge_labels/labels_v1.jsonl    # **사람이 채운다**
  label_field: human_ok            # true = 자료 범위 안 / false = 벗어남
  metric: [precision, recall, f1]  # 사람 라벨을 정답으로 본 검증기별 지표
  min_labelers: 1                  # 2명 이상이면 kappa 도 함께 싣는다

reporting:
  # 축마다 무엇을 잰 값인지 산출물이 스스로 말하게 한다 (G6-1).
  # validated_by=none 인 축은 키 이름이 pass_rate 일 수 없다 — format_rate 로 강제한다.
  require_validated_by: true
  require_measures: true
  validated_by_enum: [none, rule, cross_family]
  measures_enum: [format, groundedness, factuality]
