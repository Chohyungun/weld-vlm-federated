  # 넘지 못한다고 해서 아무것도 못 배웠다는 뜻이 아니라, **이 평가셋의 Macro-F1 축이
  # 촬영 순서로 거의 결정된다**는 뜻이다(`diagnose_id_axis.py`: id 구간 64개의 최빈 라벨
  # 점유율 중앙값 1.000, 무작위 기준선 0.445. 구간 안 train↔eval 분포 L1 중앙값 0.0000).
  #
  # 게이트를 그대로 적용하면 다섯 칸이 전부 불합격한다. **총괄 판정이 필요하다** —
  # 상세와 선택지는 `docs/dev_log/2026-08-22-데이터확정/76_감사수정_A.md` §1-4.
