# 본실험 실행 상수 — 시드 3세트 (2026-09-03 총괄 확정, 의사결정로그 "시드 3세트 확정")
#
# 파생 규칙: **base_seed + {0, 1, 2}** — 기계적 +1 증분. 시드 2·3 의 어떤 결과도 존재하기
# 전에 값 선택의 여지가 없는 규칙으로 박아 자의성을 없앤다. 시드 1(20260828)은 파일럿
# 표본·초기 가중치·LoRA 초기화·§4-6 게이트가 전부 그 위에 있는 기존 상수라 바꿀 수 없다.
#
# 위의 `seed: 20260825` 와 다른 것이다 — 그쪽은 데이터 파이프라인(분할·타일·샘플링)의
# 시드고, 여기는 학습 반복 3회의 시드다. 둘을 섞으면 데이터 분할이 학습 시드에 끌려간다.
#
# `rounds`·`local_epochs`·`total_epochs` 는 `fixed_before_main_runs.train_budget` 의 앵커를
# 가리키는 별칭이다 — 리터럴은 그쪽 한 곳뿐이다. 소비 지점(scripts/main_det.py) 이
# `experiment.rounds` 등을 확정값과 대조하므로 같은 값을 이 이름으로도 읽히게 둔다.
# --------------------------------------------------------------------------------------
experiment:
  seeds: [20260828, 20260829, 20260830]   # 시드 1·2·3 = base_seed + {0,1,2}
  rounds: *R
  local_epochs: *E
  total_epochs: *N

