# 공통 설정 — 다섯 칸이 상속하는 단일 출처
#
# 칸별 override 는 이 파일을 상속하고 **차이만** 적는다.
# `preprocess` 는 5칸 공통 고정 항목이므로 **칸별 override 를 로더 수준에서 금지한다**
# (판정문서 4-3). 확정 후 블록의 sha256 을 의사결정로그에 남긴다.

seed: 20260825          # 전역 시드. 분할·샘플링·타일 선택이 전부 여기서 파생된다

# --------------------------------------------------------------------------------------
# 전처리 — 규격 지름길 대응 (판정문서 4-3)
# --------------------------------------------------------------------------------------
preprocess:
  tile:
    rule_version: "v1"
    scope: "RT only"              # VT 는 주 실험 밖 (라벨 공간 불일치)

    tile_size: [1280, 720]        # 결함 크롭과 동일
    k: 1                          # 원본 1장당 타일 1장 — 사전 고정, 실험 중 변경 금지
    stride_x: 640                 # 후보 격자 (50% 중첩)
    vertical_anchor: band_center  # 정상 폴리곤(밴드) 세로 중심 정렬

    # τ. 정상 타일의 라벨 승계 기준. 8/25 게이트에서 band_containment 로 확정됐다.
    #
    # 원안은 "타일 ∩ 밴드폴리곤 면적비 >= τ, 폴백 1.0" 이었으나 달성 불가다. 밴드 높이
    # 중앙값 205px 가 720px 타일에 들어가면 면적비 상한이 약 0.285 이고, τ 를 그 위로
    # 두면 정상 타일이 전량 폐기되어 폐기율 상한과 충돌한다.
    #
    # 밴드 포함(band ⊆ tile)은 1280×720 에서 99.6% 가 충족한다. 초과분은 밴드 중심
    # 크롭으로 살린다. 그때는 tile ⊆ band 라 타일의 전 화소가 검사된 용접부 안이다.
    tau_mode: "band_containment"  # 2026-08-24 확정 (44_M1분기_검토판정). area_ratio 는 미사용 선택지
    tau: null                     # area_ratio 를 쓸 때만 값이 필요하다

    align8: true                  # x0, y0 를 8의 배수로 (JPEG 블록 격자 정렬)
    padding: forbidden            # 경계 초과 타일은 전량 기각. 검은 띠가 그 자체로 지름길

    # 타일 선택 — split 을 입력으로 받지 않는다. 평가셋에도 예외 없이 같은 규칙·같은 시드.
    # 내용 기반 선택 금지 (중앙 선택도, 밝기·대비 기준 "좋은 타일" 선택도 안 된다).
    selection: "sha256(image_id + seed) mod N_cand"
    selection_seed: 20260825

    encode:
      mode: "L"                   # 그레이스케일 강제 — M2 결과로 확정
      quality: 74                 # M2 전수 스캔: 양 모집단 최저 추정품질 74.6 의 내림
      progressive: false
      optimize: false
      strip_exif: true

  # 폐기 회계 상한 (판정문서 4-4). 초과 시 감독 게이트, 진행 보류.
  discard_limits:
    normal_per_material: 0.05     # 정상 셀 폐기율
    defect_per_cell_abs: 30       # 결함 셀은 30장 또는 2% 중 큰 값
    defect_per_cell_ratio: 0.02
    material_gap_pp: 0.05         # |AL − ST| 정상 폐기율 차 — RQ3 직결
    client_mix_shift_pp: 0.02     # 클라이언트별 (재질×클래스) 구성비 변화

# --------------------------------------------------------------------------------------
# 분할 — 순서가 계약이다 (스펙 §6-9)
# --------------------------------------------------------------------------------------
split:
  seed: 20260825
  eval_folds: 5                   # fold 0 = 글로벌 평가셋 20%
  val_folds: 10                   # 클라이언트 내 fold 0 = val 10%
  judgment_subset_ratio: 0.142857 # 판정문 채점 표본 (2000/14000)
  # 실행 순서: ① 매니페스트 v0 → ② 예비 분할(잠그지 않음) → ③ 학습 풀에서만 캘리브레이션
  #            → ④ 타일링 → ⑤ 매니페스트 v1 → ⑥ 최종 분할(동일 시드) → ⑦ 잠금
  # ②를 ③보다 앞에 두는 이유: 전처리 상수가 평가셋 픽셀 통계에서 유도되면
  # 불변조건 1-4 가 실질에서 깨진다.

  dirichlet:
    concentration: [0.3333333333333333, 0.16666666666666666]   # α=0.5, p=(2/3, 1/3)
    share_band: [0.60, 0.73]      # 실현 C1 지분 수용 밴드

# --------------------------------------------------------------------------------------
# 중복 묶음 (스펙 §6-2, 함정 구간 8)
# --------------------------------------------------------------------------------------
dedup:
  phash:
    hash_size: 16                 # 256-bit
    highfreq_factor: 4
  preprocess:
    bit_depth_clip: [0.5, 99.5]
    clahe: { clip_limit: 2.0, tile: [8, 8] }
  threshold_start: 32             # t0 = 32/256 (관례 8/64 와 같은 비율)
  threshold_cap: 96               # 상한 (게이트 #9). 운용점이 아니라 천장이다

  # t* = 0 (2026-08-26, tiles_v1 실측). **6-4 의 "pHash 부적합" 분기다.**
  #
  # RT 영상에서 pHash 거리는 **ID 기반 묶음의 안팎을 잘 구분하지 못한다.** 여기서 "같은
  # 묶음"은 연속 ID 로 묶은 E2 묶음이다 — 같은 용접부의 대용이지 실측된 동일성이 아니다.
  # 같은 묶음 쌍의 거리 중앙값이 126/256 으로 무작위(128)와 사실상 같고, 상한 96 에서도
  # 같은 묶음 쌍의 0.4~1.2% 만 걸린다. 거리 0 을 벗어나면 id 근접도가 오르지 않아
  # 저거리 일치가 같은 묶음이라는 근거도 없다. 원인은 타일링이 아니다 — 원본 그대로
  # 통과한 결함 이미지도 같은 분포를 보인다(§48 보고서 4절).
  #
  # 따라서 **양수 임계를 채택하지 않았다** — 거리 0(해시 완전 일치)에서만 발동시킨다.
  # 실질 방어선은 E2 메타데이터 엣지다. 이 한계는 논문 한계 절에 싣는다.
  # (2026-09-15 표현 정정, Codex 11-1: "같은 묶음 = 같은 용접부" 를 "ID 기반 묶음" 으로
  #  좁혔다. "pHash 가 같은 용접부를 가려내지 못함을 입증했다"는 주장이 아니다. 값·임계 불변.)
  threshold_final: 0
  pair_budget: 50000000

# --------------------------------------------------------------------------------------
# 본실험 착수 전 확정 상수 — 결과표 머리행에 박는다. 착수 후 수정 금지.
#
# **키 이름이 `preregistered` 가 아니다.** 파일럿 채점이 2026-09-01 15:52 에 끝났고 이 상수는
# 그 뒤(19:56, 재산출 9/2)에 확정됐다. 사전등록으로 표기하면 날짜만으로 무너진다.
# 탐색적 파일럿 → 확증적 본실험으로 정직하게 쓴다.
# **선후는 `docs/의사결정로그.md` "게이트 상수는 사전등록이 아니다" 절에 커밋 시각으로 적었다.**
# (이전 판은 여기서 "적었다"고 진술만 하고 실제 기록이 없었다 — 74번 감사 P1·M7.)
#
# **키 이름에 유도원을 박는다.** 규약:
#
#     <계열>__sel_<족선택 모집단>__fit_<규칙적합 모집단>__score_<채점 모집단>
#
# 이름만 보고 어느 모집단에서 나온 값인지 판별되지 않으면 74번 감사 A-2 가 재발한다.
# `fit_trainval` 만 게이트 재료다. `fit_eval`·`sel_eval` 이 붙은 값은 **평가셋 유도**이며
# 참고용이다 — 게이트 판정에 쓰지 마라.
#
# 산출: `scripts/recompute_baselines.py` — 다섯 칸과 **같은 채점기**(evaluation/score.py).
# 원자료 `data/interim/manifest_v1/baselines_recomputed.json`.
# 구조 진단 `scripts/diagnose_id_axis.py` → `id_axis_diagnosis.json`.
# --------------------------------------------------------------------------------------
fixed_before_main_runs:
  snapshot_id: aihub71761_rt_v1
  snapshot_digest: 1f80e98b151372e3fa44c754d0c5ab2cf06bd731d3dfdb8f2515d05383834899

  # ====================================================================================
  # 학습량 등가 예산 R × E = N — **검출·통합형 공용.**
  #
  # 2026-09-03 총괄 확정 (의사결정로그 "본실험 착수 승인 + R·E 확정"). 값의 근거는
  # 그 절에 있고 여기가 값의 정착지다 — 코드·문서는 이 키를 읽거나 링크만 건다.
  #
  # 연합 칸(분리·연합, 통합·연합)은 R 라운드 × 라운드당 로컬 E epoch, 로컬·중앙 칸은
  # N epoch 연속. 조기 종료 금지(모델·실험 정책 1)와 이 등가가 다섯 칸 공정성 주장의
  # 골격이므로 **착수 후 어느 한 값도 단독으로 바꿀 수 없다** — 셋이 등식으로 묶여 있다.
  # 키 이름은 소비 지점(fl/pilot_sim.py 의 num_rounds·local_epochs·total_epochs)과 맞췄다.
  # ====================================================================================
  train_budget:
    num_rounds: &R 50      # R — 연합 칸 라운드 수
    local_epochs: &E 2     # E — 라운드당 클라이언트 로컬 epoch (파일럿 실증 구조와 동일)
    total_epochs: &N 100   # N = R × E — 로컬·중앙 칸은 이 값으로 연속 학습
    # `&R` `&E` `&N` 은 아래 `experiment` 블록이 같은 리터럴을 가리키는 앵커다.

  # ====================================================================================
  # content-free 예측기 — 화소를 보지 않고 취득 메타데이터만 쓰는 규칙.
  #
  # **69번의 0.3465 는 "출처·재질 두 축에 한정한" 최댓값이었다.** 계열 최댓값이 아니다
  # (74번 감사 A-1). 규칙 공간을 다섯 축(출처·재질·촬영순서·묶음크기·파일크기) 640개 족으로
  # 넓혀 재산출하면 **0.9149** 다. 게이트가 실제 천장보다 0.57 낮게 등록돼 있었다.
  #
  # 절차 (74번 감사 A-2 반영):
  #   1. 족(축 조합)은 **val** 에서 고른다 — 평가셋을 열지 않는다.
  #   2. 규칙(셀→코드 집합)은 **train+val** 에서만 적합한다 — 평가셋 정답 라벨을 쓰지 않는다.
  #   3. 평가셋은 **채점에만** 쓴다.
  #   분위 절단점도 train+val 에서 뽑는다. 평가셋 분위수로 이산화하면 그것도 평가셋 유도다.
  # ====================================================================================
  content_free__sel_val__fit_trainval__score_eval12461:
    trivial_all_positive_macro_f1: 0.2160        # 적합 없음
    constant_porosity_macro_f1: 0.1523           # 적합 없음
    source_x_material_best_macro_f1: 0.3441      # 69번이 게이트로 쓴 족, train+val 적합판
    best_family: "idq512"                        # 촬영 순서(image_id) 512분위 단독
    max_macro_f1: 0.9149                         # ← 게이트 선
    miss_rate_at_max: 0.0207
    rule_space_families: 640
    axes: ["출처(N-crop/N-tile/N-band)", "재질(ST/AL)", "촬영순서(image_id 분위 2~512)",
           "묶음크기(group_size 분위 2~8)", "파일바이트크기(분위 2~8)"]
    ladder_prov3_x_idqK__fit_train__score_val:   # 분위를 잘게 할수록 오른다. 512 에서 정지
      { 2: 0.3838, 4: 0.5245, 8: 0.6590, 16: 0.7418, 32: 0.8234,
        64: 0.8851, 128: 0.8851, 256: 0.8914, 512: 0.8840 }

  # ====================================================================================
  # 무내용 대조선 — **분류 축(macro-AP).** 위 F1 블록의 AP 판. **기록용이며 게이트가 아니다.**
  #
  # 2026-09-08 총괄 판정 22번 §6 (main dd430ae): macro-AP 는 분류 축 대표에서 내렸다 — 다섯 칸
  # 전부(최고 칸 0.8229)가 이 대조선(0.9582) 아래다. 보조로 싣되 대조선을 반드시 병기하고,
  # **`content_free_gate` 를 AP 축으로 넓히지 않는다**(§6-2-6 — 철회한 전제를 코드에 새기지
  # 않는다). 그래서 이 블록에는 게이트 스위치가 없고 D 의 GATE_KEYS 도 여기를 보지 않는다.
  # 시드 3세트 판정 뒤 다시 본다.
  #
  # **이 값들은 사전등록이 아니다 — 시드 1 채점 뒤에 산출·등록됐다.** 선후 (커밋 시각 실측, KST):
  #
  #   2026-09-08 08:42  D, 17번 시드 1 첫 채점 보고                                     wt/D deea275
  #   2026-09-08 16:51  칸의 macro-AP 산출 경로가 main 에 들어옴 (최고 칸 0.8229 가 알려짐)  28d3b18
  #   2026-09-08 19:04  총괄 22번 §5 — 무내용 대조 산출 배분                             af521fd
  #   2026-09-08 19:10  D, 점수 구성 H·F·판정 규칙을 **산출 전** 등록 (17번 §11)          3f8d5cb
  #   2026-09-08 19:18  D, 대조선 산출 (outputs/main_d/seed1/content_free_baselines_v1.json)
  #   2026-09-08 20:17  D, 17번 §12 결과 · §13 등록 요청                                  cea8cf1
  #   2026-09-08 20:20  총괄 22번 §6 — 대표 철회 · A 등록 배분                             dd430ae
  #   2026-09-08 20:50  A, 이 블록 등록 (작성 시각. 커밋 시각은 git log 가 정본)            이 커밋
  #
  # 그런데도 값 선택의 여지가 없었던 근거: 족·절단점·적합 모집단은 위 F1 블록에서 그대로 상속해
  # 다시 고르지 않았고, 점수 구성과 "어떤 값이 나오면 무엇을 말할지"는 산출 8분 전에 커밋으로
  # 고정됐으며, 산출 뒤 더하거나 뺀 값이 없다. 시드 1 결과에 대해서는 사후이고 시드 2·3 에
  # 대해서는 사전 고정이다 — 표에는 언제나 칸 값 옆에 이 대조선을 병기한다. 선후 표는
  # `docs/의사결정로그.md` "무내용 AP 대조선은 사전등록이 아니다" 절에도 같은 내용으로 적었다.
  #
  # 점수 구성 (17번 §11-2, 산출 전 확정):
  #   F (빈도) — 이미지가 속한 id 구간의 train+val 클래스 빈도를 4클래스 전부에 점수로 준다.
  #              순위 지표에서 무내용 규칙이 도달할 수 있는 최대 → **주 대조선.**
  #   H (하드) — 구간 최빈 정답 코드 집합에 1, 나머지는 점수 부재. AP = P·R.
  #
  # **H 는 위 F1 블록의 예측기가 아니다 (17번 §13-3 의 답, A 실측).** F1 블록의 규칙은 클래스별로
  # 구간을 양성률 순으로 세워 F1 이 최대인 접두사를 고르는 형태(scripts/recompute_baselines.py
  # fit_rule)고, H 는 구간별 최빈 코드 집합이다. 같은 족·같은 절단점(512 구간 배정 전부 일치)·
  # 같은 모집단 위의 **다른 규칙 형태**다. 512 구간 중 1개에서만 예측이 갈리고 그것이 재구성 F1
  # 0.9128 과 등록 0.9149 의 차 0.0021 전부다(scripts/verify_content_free_rule_form.py 가 둘 다
  # 소수 6자리까지 재현). 같은 예측기였다면 H ≥ 0.9149² = 0.8370 이어야 하는데(P·R ≥ F1² 과
  # Jensen) 실측 0.8355 라 수치가 스스로 말한다. 주 대조선 F 는 코드 집합 선택과 무관한 점수라
  # 이 차이의 영향을 받지 않는다.
  #
  # 수명: idq512 대조선은 동결본 train+val 에 적합한 값이라 **스냅샷이 바뀌면 다시 내야 한다.**
  # 판별력 Δ·Δ_AUC 의 무내용 기준선은 정의상 0 이라 등록할 상수가 없다(17번 §13-1).
  # ====================================================================================
  content_free_ap__sel_val__fit_trainval__score_eval12461:
    best_family: "idq512"                  # 위 F1 블록과 같은 족 — 다시 고르지 않았다
