[project]
name = "weld-fl"
version = "0.1.0"
description = "연합학습 기반 용접 결함 판정 연구 (weld-fl)"
readme = "README.md"
requires-python = "==3.11.*"
license = { file = "LICENSE" }
dependencies = [
    # --- 수치·배열 ---
    # numpy>=2.0 필수 — dedup 전수 popcount 가 np.bitwise_count 를 쓴다 (스펙 §6-3)
    "numpy>=2.0,<2.3",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    # --- 이미지 ---
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "shapely>=2.0",
    "imagehash>=4.3",
    # --- 설정·검증 ---
    "omegaconf>=2.3",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    # 등록부 스키마 검증 (scripts/validate_registry.py)
    "jsonschema>=4.23",
    # --- 추적 ---
    "mlflow>=2.16",
    # --- 딥러닝 (cu128 / sm_120) ---
    "torch>=2.7",
    "torchvision>=0.22",
    # --- 시각화 (분포 히트맵) ---
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# 트랙 C — 검출·VLM·연합
detection = ["ultralytics>=8.3", "pycocotools>=2.0.8"]
vlm = ["transformers>=4.51", "peft>=0.13", "accelerate>=1.0", "bitsandbytes>=0.45", "trl>=0.12", "datasets>=3.0"]
fl = ["flwr[simulation]>=1.13"]
# 트랙 B — 코퍼스·합성
# easyocr: 후보 문서 32건 중 8건이 텍스트 레이어 0인 스캔본이라 OCR 이 필요하다.
# 한글 인식이 되어야 해서 easyocr(ko+en) 을 쓴다 (RapidOCR 은 한글 미지원).
# bitsandbytes: 검증기(다른 계열 8B)를 16GB 에 올리려면 4bit 적재가 필요하다.
# bf16 은 16GB 에서 적재 도중 죽는다(실측).
corpus = ["docling>=2.0", "pdfplumber>=0.11", "easyocr>=1.7", "bitsandbytes>=0.46.1"]
# 트랙 D — RAG·평가
rag = ["FlagEmbedding>=1.3", "faiss-cpu>=1.8", "chromadb>=0.5"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

# --- Flower 앱 등록 (80번 체크리스트 14항 / F1) ---
# 이 절이 없으면 `flwr run` 이 앱을 **해석조차 못 한다.** 본실험 진입점이 코드로는
# 존재하는데 프레임워크가 찾지 못하는 상태였다.
#
# run-config 기본값은 파일럿 상수다. 본실험 값(R·E·시드)은 실행 시 덮어쓴다 —
# 여기 박아 두면 configs 와 정본이 둘이 된다(80번 G8).
[tool.flwr.app]
publisher = "weld-fl"

[tool.flwr.app.components]
serverapp = "fl.server_app:app"
# 클라이언트는 칸 디스패처 하나다(fl/client_app.py). 구판은 fl.client_det:app 을
# 등록했는데 그 train 핸들러가 죽어 있었다 — "등록된 것은 죽어 있고 도는 것은 등록돼
# 있지 않다"(85번 ⑤). ⑦(uni_fed)도 별도 앱이 아니라 run-config 의 cell 로 고른다:
#   flwr run . local-sim --run-config 'cell="uni_fed" ...'
clientapp = "fl.client_app:app"

[tool.flwr.app.config]
cell = "sep_fed"
num-server-rounds = 3
local-epochs = 2
total-epochs = 6
num-clients = 3
num-classes = 4
base-seed = 20260828
run-stamp = "000000"
split-hash = ""
model = "yolo11s.pt"
project = "outputs/pilot_c"
views-root = "outputs/pilot_c/views"
profile = "main"
num-examples = "1,1,1"
client-tags = "C1,C2,C3"

[tool.flwr.federations]
default = "local-sim"

[tool.flwr.federations.local-sim]
options.num-supernodes = 3
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 1.0

# --- sm_120 (Blackwell) 전용: cu128 이상 휠만 사용 ---
# RTX 5060 Ti는 compute capability 12.0 이라 cu121 계열 휠에서 커널이 없다.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

# 저장소 자체는 설치 가능한 배포물이 아니다. 모듈은 리포 루트 기준 경로로 import 한다.
[tool.uv]
package = false
