[project]
name = "weld-fl"
version = "0.1.0"
description = "연합학습 기반 용접 결함 판정 연구 (weld-fl)"
readme = "README.md"
requires-python = "==3.11.*"
license = { file = "LICENSE" }
dependencies = [
    # --- 수치·배열 ---
    # numpy>=2.0 필수 — dedup 전수 popcount 가 np.bitwise_count 를 쓴다 (스펙 §6-3)
    "numpy>=2.0,<2.3",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    # --- 이미지 ---
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "shapely>=2.0",
    "imagehash>=4.3",
    # --- 설정·검증 ---
    "omegaconf>=2.3",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    # 등록부 스키마 검증 (scripts/validate_registry.py)
    "jsonschema>=4.23",
    # --- 추적 ---
    "mlflow>=2.16",
    # --- 딥러닝 (cu128 / sm_120) ---
    "torch>=2.7",
    "torchvision>=0.22",
    # --- 시각화 (분포 히트맵) ---
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# 트랙 C — 검출·VLM·연합
detection = ["ultralytics>=8.3", "pycocotools>=2.0.8"]
vlm = ["transformers>=4.51", "peft>=0.13", "accelerate>=1.0", "bitsandbytes>=0.45", "trl>=0.12", "datasets>=3.0"]
fl = ["flwr[simulation]>=1.13"]
# 트랙 B — 코퍼스·합성
# easyocr: 후보 문서 32건 중 8건이 텍스트 레이어 0인 스캔본이라 OCR 이 필요하다.
# 한글 인식이 되어야 해서 easyocr(ko+en) 을 쓴다 (RapidOCR 은 한글 미지원).
corpus = ["docling>=2.0", "pdfplumber>=0.11", "easyocr>=1.7"]
# 트랙 D — RAG·평가
rag = ["FlagEmbedding>=1.3", "faiss-cpu>=1.8", "chromadb>=0.5"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

# --- sm_120 (Blackwell) 전용: cu128 이상 휠만 사용 ---
# RTX 5060 Ti는 compute capability 12.0 이라 cu121 계열 휠에서 커널이 없다.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

# 저장소 자체는 설치 가능한 배포물이 아니다. 모듈은 리포 루트 기준 경로로 import 한다.
[tool.uv]
package = false
