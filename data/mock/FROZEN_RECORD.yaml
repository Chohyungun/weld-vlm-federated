# 두 동결 스냅샷의 기대값과, **동결본 복원이 검증된 입력**의 식별. 스냅샷 디렉터리 밖에 둔다.
#
# 왜 밖인가: `verify_snapshot()` 은 파일을 같은 디렉터리의 `SNAPSHOT.sha256` 과만 대조한다. 생성기가 파일과
# 잠금 기록을 함께 바꾸면 그 검증은 통과한다. 생성기는 이 파일을 쓰지 않으므로, 그런 교체가 여기서 드러난다
# (`tests/test_make_mock_manifest.py` 가 대조한다).
#
# 입력에 관해 이 파일이 말하는 것과 말하지 않는 것:
#   말하는 것   — 아래 사상표·프로필을 아래 생성기·환경에 넣으면 두 동결본의 구성 파일 8개가 잠금 기록까지
#                 바이트 단위로 복원된다(2026-09-21 확인).
#   말하지 않는 것 — 동결본을 만들 때 실제로 쓴 입력 파일의 모든 바이트와 실행 환경. 당시의 별도 기록은 없다.
#
# 왜 내용 해시인가: 사상표 `version` 은 동결본에도 지금도 1 이고 `snapshot_id`·생성 시각도 같다. 이름·버전·시각으로는
# 동결본과 현행 입력 생성분을 구별할 수 없다.
#
# 이 파일은 기록이다. 동결본을 맞추려고 현행 사상표에 옛 표기를 되살리지 않는다(개발규약 1-6 · 65번 §8~§11).
#
# **공개본만으로는 동결 검증 당시 판의 바이트를 확인할 수 없다.** 공개 저장소는 부모 없는 단일 커밋이라
# 그때의 blob 이 객체 DB 에 없다. 그 대조는 아래 `local_ref` 를 가진 저장소에서만 선다.
# 그 ref 들(`refs/frozen/mock-inputs/*`)은 **로컬 전용이며 공개본에 없다.** blob 에 직접 걸어 두었다 —
# backup 브랜치를 가리키지 않는다. 그쪽에서 닿는 것은 우연이고, 생성기 하나는 어느 ref 에서도 닿지 않아
# 정리 한 번이면 사라질 상태였다(2026-09-25 실측).
#
# 해시가 갈라지면 **덮어쓰지 않고 병기한다.** 동결 검증 당시의 해시를 새 값으로 바꾸면 "이 바이트가 동결본을
# 만들었다" 는 기록이 거짓이 된다. 갈라진 항목에는 `after_public_cleanup` 을 달아 당시 값과 지금 값, 그 사이에
# 바뀐 것, 그래도 결과가 같다는 확인을 함께 남긴다. 한쪽만 있으면 시험이 실패한다.
